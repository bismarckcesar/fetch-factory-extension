<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetch Factory - Opcoes</title>
    <link rel="stylesheet" href="./options.css">
  </head>
  <body>
    <main class="page">
      <h1>Fetch Factory</h1>

      <form id="options-form" class="form">
        <label class="field">
          <span>Endpoint</span>
          <input id="endpoint-url" type="url" placeholder="https://example.com/endpoint" autocomplete="off">
        </label>

        <label class="field">
          <span>Type</span>
          <input id="payload-type" type="text" placeholder="asurascans" autocomplete="off">
        </label>

        <label class="checkbox-field">
          <input id="auto-send-enabled" type="checkbox">
          <span>Envio automatico</span>
        </label>

        <button type="submit">Salvar</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./options.js"></script>
  </body>
</html>
