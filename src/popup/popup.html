<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetch Factory</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Fetch Factory</h1>
      </header>

      <form id="settings-form" class="form">
        <label class="field">
          <span>Perfil</span>
          <select id="profile-select"></select>
        </label>

        <label class="field">
          <span>Nome do perfil</span>
          <input id="profile-name" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>Endpoint</span>
          <input id="endpoint-url" type="url" placeholder="https://example.com/endpoint" autocomplete="off">
        </label>

        <label class="field">
          <span>Type</span>
          <input id="payload-type" type="text" placeholder="asurascans" autocomplete="off">
        </label>

        <label class="field">
          <span>Parametros extras JSON</span>
          <textarea id="extra-params" rows="5" spellcheck="false" placeholder="{ &quot;paramcustom1&quot;: &quot;&quot;, &quot;paramcustom2&quot;: &quot;&quot; }"></textarea>
        </label>

        <button id="save-button" type="submit">Salvar configuracao</button>
      </form>

      <button id="capture-button" class="primary-button" type="button">Capturar e enviar</button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <footer class="footer">
        <a href="../options/options.html" target="_blank" rel="noreferrer">Opcoes</a>
      </footer>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
